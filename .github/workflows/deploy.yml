name: Deploy to Pi

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull latest code
        run: |
          cd ~/BML-Print-Queue-Site
          git pull origin main

      - name: Rebuild and restart
        run: |
          cd ~/BML-Print-Queue-Site
          docker compose down
          docker compose up --build -d
