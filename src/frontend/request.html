<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/BML.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Submit Print Job - BML Print Queue</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --purdue-gold: #CFB991;
        --purdue-black: #000000;
        --purdue-dark-gray: #1a1a1a;
        --purdue-medium-gray: #2d2d2d;
        --purdue-light-gray: #3d3d3d;
        --text-light: #ffffff;
        --text-gray: #b0b0b0;
        --border-color: #404040;
        --error-red: #e74c3c;
        --success-green: #2ecc71;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: var(--purdue-black);
        min-height: 100vh;
        color: var(--text-light);
        padding: 20px;
      }

      .container {
        max-width: 800px;
        margin: 0 auto;
        background: var(--purdue-dark-gray);
        border-radius: 12px;
        overflow: hidden;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      }

      .header {
        background: var(--purdue-black);
        border-bottom: 3px solid var(--purdue-gold);
        padding: 40px 30px;
        text-align: center;
      }

      .header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
        color: var(--purdue-gold);
        font-weight: 700;
      }

      .header p {
        font-size: 1.1rem;
        color: var(--text-gray);
        line-height: 1.6;
      }

      .form-container {
        padding: 40px 30px;
      }

      .form-group {
        margin-bottom: 25px;
      }

      .form-group label {
        display: block;
        color: var(--text-light);
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 8px;
      }

      .form-group label .required {
        color: var(--error-red);
        margin-left: 4px;
      }

      .form-group input[type="text"],
      .form-group input[type="email"],
      .form-group input[type="number"],
      .form-group select,
      .form-group textarea {
        width: 100%;
        padding: 12px 15px;
        background: var(--purdue-medium-gray);
        border: 2px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-light);
        font-size: 1rem;
        transition: all 0.3s ease;
      }

      .form-group input:focus,
      .form-group select:focus,
      .form-group textarea:focus {
        outline: none;
        border-color: var(--purdue-gold);
        background: var(--purdue-light-gray);
      }

      .form-group textarea {
        min-height: 120px;
        resize: vertical;
        font-family: inherit;
      }

      .form-group .hint {
        display: block;
        margin-top: 6px;
        font-size: 0.9rem;
        color: var(--text-gray);
        line-height: 1.5;
      }

      .form-group .hint a {
        color: var(--purdue-gold);
        text-decoration: none;
      }

      .form-group .hint a:hover {
        text-decoration: underline;
      }

      .name-group {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 15px;
      }

      .radio-group {
        display: flex;
        gap: 20px;
        margin-top: 10px;
      }

      .radio-group label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        font-weight: 400;
      }

      .radio-group input[type="radio"] {
        width: 20px;
        height: 20px;
        cursor: pointer;
      }

      .file-upload {
        position: relative;
      }

      .file-upload input[type="file"] {
        display: none;
      }

      .file-upload-label {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 15px 20px;
        background: var(--purdue-medium-gray);
        border: 2px dashed var(--border-color);
        border-radius: 8px;
        cursor: pointer;
        transition: all 0.3s ease;
        color: var(--text-gray);
      }

      .file-upload-label:hover {
        border-color: var(--purdue-gold);
        background: var(--purdue-light-gray);
        color: var(--text-light);
      }

      .file-upload-label svg {
        stroke: currentColor;
      }

      .file-name {
        margin-top: 10px;
        padding: 10px 15px;
        background: var(--purdue-light-gray);
        border-radius: 6px;
        color: var(--purdue-gold);
        font-size: 0.9rem;
        display: none;
      }

      .file-name.active {
        display: block;
      }

      .submit-btn {
        width: 100%;
        padding: 18px 30px;
        background: var(--purdue-gold);
        color: var(--purdue-black);
        border: none;
        border-radius: 8px;
        font-size: 1.2rem;
        font-weight: 700;
        cursor: pointer;
        transition: all 0.3s ease;
        margin-top: 30px;
      }

      .submit-btn:hover {
        background: #e5d4a8;
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(207, 185, 145, 0.4);
      }

      .submit-btn:active {
        transform: translateY(0);
      }

      .submit-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none;
      }

      .error-message {
        background: rgba(231, 76, 60, 0.2);
        border: 2px solid var(--error-red);
        color: var(--error-red);
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
      }

      .error-message.active {
        display: block;
      }

      .success-message {
        background: rgba(46, 204, 113, 0.2);
        border: 2px solid var(--success-green);
        color: var(--success-green);
        padding: 15px;
        border-radius: 8px;
        margin-bottom: 20px;
        display: none;
        text-align: center;
      }

      .success-message.active {
        display: block;
      }

      .discord-notice {
        background: var(--purdue-medium-gray);
        border-left: 4px solid var(--purdue-gold);
        padding: 15px 20px;
        border-radius: 6px;
        margin-bottom: 25px;
      }

      .discord-notice h3 {
        color: var(--purdue-gold);
        margin-bottom: 10px;
        font-size: 1.1rem;
      }

      .discord-notice p {
        color: var(--text-gray);
        line-height: 1.6;
        margin-bottom: 10px;
      }

      .discord-notice a {
        color: var(--purdue-gold);
        text-decoration: none;
        font-weight: 600;
      }

      .discord-notice a:hover {
        text-decoration: underline;
      }

      @media (max-width: 600px) {
        .name-group {
          grid-template-columns: 1fr;
        }

        .radio-group {
          flex-direction: column;
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Submit Print Job Request</h1>
        <p>Boilermaker Labs - Purdue University</p>
      </div>

      <div class="form-container">
        <div id="error-message" class="error-message"></div>
        <div id="success-message" class="success-message"></div>

        <form id="print-job-form">
          <!-- Name -->
          <div class="form-group">
            <label>Name <span class="required">*</span></label>
            <div class="name-group">
              <input 
                type="text" 
                id="first-name" 
                placeholder="First Name" 
                required
              />
              <input 
                type="text" 
                id="last-name" 
                placeholder="Last Name" 
                required
              />
            </div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label for="email">E-mail <span class="required">*</span></label>
            <input 
              type="email" 
              id="email" 
              placeholder="yourname@purdue.edu" 
              pattern=".*@purdue\.edu$"
              required
            />
            <span class="hint">Purdue E-mail only</span>
          </div>

          <!-- Part Name -->
          <div class="form-group">
            <label for="part-name">Part Name <span class="required">*</span></label>
            <input 
              type="text" 
              id="part-name" 
              placeholder="Enter the name of your part" 
              required
            />
          </div>

          <!-- Material -->
          <div class="form-group">
            <label for="material">Material <span class="required">*</span></label>
            <select id="material" required>
              <option value="">Select Material</option>
              <option value="PLA">PLA</option>
              <option value="ABS">ABS</option>
              <option value="PETG">PETG</option>
              <option value="TPU">TPU</option>
              <option value="NYLON">Nylon</option>
            </select>
          </div>

          <!-- User Supplied Material -->
          <div class="form-group">
            <label>User Supplied Material <span class="required">*</span></label>
            <div class="radio-group">
              <label>
                <input type="radio" name="user-supplied" value="no" checked />
                No
              </label>
              <label>
                <input type="radio" name="user-supplied" value="yes" />
                Yes
              </label>
            </div>
          </div>

          <!-- Quantity -->
          <div class="form-group">
            <label for="quantity">Quantity Required <span class="required">*</span></label>
            <input 
              type="number" 
              id="quantity" 
              placeholder="Number of copies to print" 
              min="1"
              value="1"
              required
            />
            <span class="hint">Number of copies to print</span>
          </div>

          <!-- Requested Color -->
          <div class="form-group">
            <label for="color">Requested Color <span class="required">*</span></label>
            <select id="color" required>
              <option value="">Select Color</option>
              <option value="Black">Black (ABS, PLA, PETG)</option>
              <option value="Blue">Blue (ABS)</option>
              <option value="Gold">Gold (PLA)</option>
              <option value="Green">Green (ABS, PLA)</option>
              <option value="Orange">Orange (PLA)</option>
              <option value="Pink">Pink (PLA)</option>
              <option value="Purple">Purple (PLA)</option>
              <option value="Red">Red (ABS, PETG)</option>
              <option value="Silver">Silver (PLA)</option>
              <option value="White">White (ABS, PETG)</option>
              <option value="Yellow">Yellow (PLA)</option>
            </select>
            <span class="hint">Color is not guaranteed</span>
          </div>

          <!-- Discord ID -->
          <div class="form-group">
            <label for="discord-id">Discord ID</label>
            <input 
              type="text" 
              id="discord-id" 
              placeholder="Your Discord username" 
            />
            <span class="hint">Your Discord username (must match student username)</span>
          </div>

          <!-- Upload STL File -->
          <div class="form-group">
            <label>Upload STL File <span class="required">*</span></label>
            <div class="file-upload">
              <input 
                type="file" 
                id="stl-file" 
                accept=".stl"
                required
              />
              <label for="stl-file" class="file-upload-label">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="17 8 12 3 7 8"></polyline>
                  <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
                Click to upload STL file
              </label>
              <div id="file-name" class="file-name"></div>
            </div>
            <span class="hint">Only .stl files are accepted</span>
          </div>

          <!-- Special Instructions -->
          <div class="form-group">
            <label for="special-instructions">Special Instructions / Comments</label>
            <textarea 
              id="special-instructions" 
              placeholder="Any special requirements or comments about your print job..."
            ></textarea>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="submit-btn" id="submit-btn">
            Submit Print Job Request
          </button>
        </form>
      </div>
    </div>

    <script type="module" src="/src/request.ts"></script>
  </body>
</html>
