<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Print Job Queue</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 20px;
      }

      #app {
        max-width: 1200px;
        margin: 0 auto;
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        overflow: hidden;
      }

      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px;
        text-align: center;
      }

      .header h1 {
        font-size: 2.5rem;
        margin-bottom: 10px;
      }

      .header p {
        font-size: 1.1rem;
        opacity: 0.9;
      }

      .content {
        padding: 30px;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: #666;
        font-size: 1.2rem;
      }

      .error {
        background: #fee;
        border: 2px solid #fcc;
        color: #c33;
        padding: 20px;
        border-radius: 8px;
        margin: 20px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }

      thead {
        background: #f8f9fa;
      }

      th {
        padding: 15px;
        text-align: left;
        font-weight: 600;
        color: #333;
        border-bottom: 2px solid #dee2e6;
      }

      td {
        padding: 15px;
        border-bottom: 1px solid #dee2e6;
      }

      tbody tr:hover {
        background: #f8f9fa;
      }

      .status {
        display: inline-block;
        padding: 5px 12px;
        border-radius: 20px;
        font-size: 0.85rem;
        font-weight: 600;
      }

      .status.PENDING {
        background: #fff3cd;
        color: #856404;
      }

      .status.IN_PROGRESS {
        background: #cfe2ff;
        color: #084298;
      }

      .status.COMPLETED {
        background: #d1e7dd;
        color: #0f5132;
      }

      .status.CANCELLED {
        background: #f8d7da;
        color: #842029;
      }

      .status.FAILED {
        background: #f8d7da;
        color: #842029;
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: #6c757d;
      }

      .empty-state svg {
        width: 100px;
        height: 100px;
        margin-bottom: 20px;
        opacity: 0.5;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div class="header">
        <h1>🖨️ Print Job Queue</h1>
        <p>BML 3D Print Management System</p>
      </div>

      <div class="content">
        <div id="loading" class="loading">
          Loading print jobs...
        </div>

        <div id="error" class="error" style="display: none;"></div>

        <div id="table-container" style="display: none;">
          <table>
            <thead>
              <tr>
                <th>Job ID</th>
                <th>Part Name</th>
                <th>User</th>
                <th>Material</th>
                <th>Status</th>
                <th>Created</th>
              </tr>
            </thead>
            <tbody id="jobs-body">
              <!-- Jobs will be inserted here -->
            </tbody>
          </table>
        </div>

        <div id="empty-state" class="empty-state" style="display: none;">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4" />
          </svg>
          <h2>No Print Jobs Yet</h2>
          <p>Create your first print job to get started!</p>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
