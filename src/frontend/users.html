<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/BML.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management - BML</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      :root {
        --purdue-gold: #CFB991;
        --purdue-black: #000000;
        --purdue-dark-gray: #1a1a1a;
        --purdue-medium-gray: #2d2d2d;
        --purdue-light-gray: #3d3d3d;
        --text-light: #ffffff;
        --text-gray: #b0b0b0;
        --border-color: #404040;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        background: var(--purdue-black);
        min-height: 100vh;
        color: var(--text-light);
        overflow-x: hidden;
      }

      #app {
        max-width: 1400px;
        margin: 0 auto;
        background: var(--purdue-dark-gray);
        min-height: 100vh;
      }

      .header {
        background: var(--purdue-black);
        border-bottom: 3px solid var(--purdue-gold);
        padding: 30px;
        text-align: center;
      }

      .header h1 {
        font-size: clamp(1.5rem, 6vw, 2.5rem);
        margin-bottom: 10px;
        color: var(--purdue-gold);
        font-weight: 700;
      }

      .header p {
        font-size: 1.1rem;
        color: var(--text-gray);
      }

      .nav-container {
        padding: 20px 30px;
        background: var(--purdue-black);
        border-bottom: 1px solid var(--border-color);
      }

      .nav-btn {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 12px 24px;
        background: transparent;
        color: var(--purdue-gold);
        border: 2px solid var(--purdue-gold);
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        text-decoration: none;
        touch-action: manipulation;
      }

      .nav-btn:hover {
        background: var(--purdue-gold);
        color: var(--purdue-black);
        transform: translateY(-2px);
      }

      @media (hover: none) {
        .nav-btn:hover { transform: none; }
        .nav-btn:active { background: var(--purdue-gold); color: var(--purdue-black); }
      }

      .content {
        padding: 30px;
      }

      @media (max-width: 600px) {
        .content { padding: 16px; }
        .nav-container { padding: 14px 16px; }
        .header { padding: 20px 16px; }
      }

      .search-container {
        margin-bottom: 24px;
        display: flex;
        justify-content: center;
      }

      .search-box {
        position: relative;
        width: 100%;
        max-width: 600px;
      }

      .search-input {
        width: 100%;
        padding: 15px 50px 15px 20px;
        background: var(--purdue-medium-gray);
        border: 2px solid var(--border-color);
        border-radius: 8px;
        color: var(--text-light);
        font-size: 1.1rem;
        transition: all 0.3s ease;
        -webkit-appearance: none;
        appearance: none;
      }

      .search-input:focus {
        outline: none;
        border-color: var(--purdue-gold);
        background: var(--purdue-light-gray);
      }

      .search-icon {
        position: absolute;
        right: 15px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-gray);
        pointer-events: none;
      }

      .loading {
        text-align: center;
        padding: 40px;
        color: var(--text-gray);
        font-size: 1.2rem;
      }

      .error {
        background: #3d1f1f;
        border: 2px solid #8b3a3a;
        color: #ff6b6b;
        padding: 20px;
        border-radius: 8px;
        margin: 20px 0;
      }

      /* ── Desktop Table (hidden on mobile) ── */
      .users-table-container {
        background: var(--purdue-medium-gray);
        border: 2px solid var(--border-color);
        border-radius: 8px;
        overflow: hidden;
      }

      .users-table {
        width: 100%;
        border-collapse: collapse;
      }

      .users-table thead {
        background: var(--purdue-black);
      }

      .users-table th {
        padding: 20px;
        text-align: left;
        color: var(--purdue-gold);
        font-weight: 700;
        text-transform: uppercase;
        font-size: 0.9rem;
        border-bottom: 2px solid var(--purdue-gold);
      }

      .users-table td {
        padding: 20px;
        border-bottom: 1px solid var(--border-color);
        color: var(--text-light);
      }

      .users-table tbody tr {
        transition: all 0.2s ease;
        cursor: pointer;
      }

      .users-table tbody tr:hover {
        background: var(--purdue-light-gray);
      }

      /* Hide table, show cards on mobile */
      @media (max-width: 700px) {
        .users-table-container {
          display: none !important;
        }
      }

      /* ── Mobile Cards (hidden on desktop) ── */
      .users-card-list {
        display: none;
        flex-direction: column;
        gap: 12px;
      }

      @media (max-width: 700px) {
        .users-card-list {
          display: flex;
        }
      }

      .user-card {
        background: var(--purdue-medium-gray);
        border: 2px solid var(--border-color);
        border-radius: 8px;
        padding: 16px;
        cursor: pointer;
        transition: all 0.2s ease;
        -webkit-tap-highlight-color: rgba(207, 185, 145, 0.15);
      }

      .user-card:active {
        border-color: var(--purdue-gold);
        background: var(--purdue-light-gray);
      }

      .user-card-name {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--purdue-gold);
        margin-bottom: 4px;
      }

      .user-card-email {
        font-size: 0.85rem;
        color: var(--text-gray);
        margin-bottom: 12px;
        word-break: break-all;
      }

      .user-card-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-top: 8px;
      }

      .user-card-label {
        font-size: 0.78rem;
        color: var(--text-gray);
        text-transform: uppercase;
        margin-bottom: 2px;
      }

      .user-card-value {
        font-size: 0.95rem;
        color: var(--text-light);
        font-weight: 600;
      }

      /* ── Shared UI Elements ── */
      .usage-bar-container {
        width: 100%;
        max-width: 200px;
      }

      .usage-bar {
        height: 8px;
        background: var(--purdue-light-gray);
        border-radius: 4px;
        overflow: hidden;
        margin-bottom: 5px;
      }

      .usage-bar-fill {
        height: 100%;
        background: linear-gradient(90deg, #58d68d, var(--purdue-gold), #ff6b6b);
        border-radius: 4px;
        transition: width 0.3s ease;
      }

      .usage-text {
        font-size: 0.9rem;
        color: var(--text-gray);
      }

      .usage-over-limit {
        color: #ff6b6b;
        font-weight: 700;
      }

      .job-count {
        display: inline-block;
        padding: 6px 12px;
        background: rgba(207, 185, 145, 0.2);
        border: 1px solid var(--purdue-gold);
        border-radius: 20px;
        font-size: 0.9rem;
        font-weight: 600;
      }

      .empty-state {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-gray);
      }

      .empty-state svg {
        width: 80px;
        height: 80px;
        margin-bottom: 20px;
        opacity: 0.3;
        stroke: var(--purdue-gold);
      }

      .empty-state h2 {
        color: var(--text-light);
        margin-bottom: 10px;
      }

      /* ── Modal ── */
      .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.9);
        z-index: 1000;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .modal.active {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        padding: 12px;
      }

      @media (min-width: 600px) {
        .modal.active {
          align-items: center;
          padding: 20px;
        }
      }

      .modal-content {
        background: var(--purdue-dark-gray);
        border: 3px solid var(--purdue-gold);
        border-radius: 12px;
        max-width: 900px;
        width: 100%;
        max-height: 95vh;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        margin-top: 8px;
        margin-bottom: 8px;
      }

      .modal-header {
        background: var(--purdue-black);
        padding: 18px 20px;
        border-bottom: 2px solid var(--purdue-gold);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        position: sticky;
        top: 0;
        z-index: 10;
      }

      .modal-title {
        font-size: clamp(1.1rem, 4.5vw, 1.8rem);
        color: var(--purdue-gold);
        font-weight: 700;
        word-break: break-word;
      }

      .close-btn {
        background: transparent;
        border: 2px solid var(--purdue-gold);
        color: var(--purdue-gold);
        font-size: 1.3rem;
        width: 38px;
        height: 38px;
        min-width: 38px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.3s ease;
        touch-action: manipulation;
      }

      .close-btn:hover {
        background: var(--purdue-gold);
        color: var(--purdue-black);
      }

      .modal-body {
        padding: 20px;
      }

      @media (min-width: 600px) {
        .modal-body { padding: 30px; }
      }

      .detail-section {
        margin-bottom: 30px;
      }

      .detail-section h3 {
        color: var(--purdue-gold);
        font-size: 1.2rem;
        margin-bottom: 12px;
        border-bottom: 2px solid var(--border-color);
        padding-bottom: 8px;
      }

      .detail-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 10px;
      }

      @media (min-width: 480px) {
        .detail-grid {
          grid-template-columns: repeat(2, 1fr);
          gap: 15px;
        }
      }

      .detail-item {
        background: var(--purdue-medium-gray);
        padding: 12px 15px;
        border-radius: 6px;
        border-left: 3px solid var(--purdue-gold);
      }

      .detail-label {
        font-size: 0.78rem;
        color: var(--text-gray);
        text-transform: uppercase;
        margin-bottom: 4px;
      }

      .detail-value {
        font-size: 1rem;
        color: var(--text-light);
        font-weight: 600;
        word-break: break-word;
      }

      .jobs-list {
        max-height: 400px;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }

      .job-item {
        background: var(--purdue-medium-gray);
        padding: 14px;
        border-radius: 6px;
        margin-bottom: 10px;
        border-left: 3px solid var(--purdue-gold);
      }

      .job-item-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
        flex-wrap: wrap;
      }

      .job-item-title {
        font-weight: 700;
        color: var(--purdue-gold);
        word-break: break-word;
      }

      .status {
        display: inline-block;
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 0.72rem;
        font-weight: 700;
        text-transform: uppercase;
        white-space: nowrap;
        flex-shrink: 0;
      }

      .status.PENDING { background: rgba(207, 185, 145, 0.2); color: var(--purdue-gold); border: 1px solid var(--purdue-gold); }
      .status.WAITING { background: rgba(241, 196, 15, 0.2); color: #f4d03f; border: 1px solid #f4d03f; }
      .status.IN_PROGRESS { background: rgba(52, 152, 219, 0.2); color: #5dade2; border: 1px solid #5dade2; }
      .status.ACTION_NEEDED { background: rgba(230, 126, 34, 0.2); color: #f39c12; border: 1px solid #f39c12; }
      .status.COMPLETED { background: rgba(46, 204, 113, 0.2); color: #58d68d; border: 1px solid #58d68d; }
      .status.CANCELLED, .status.FAILED { background: rgba(231, 76, 60, 0.2); color: #ec7063; border: 1px solid #ec7063; }
    </style>
  </head>

  <body>
    <div id="app">
      <div class="header">
        <h1>User Filament Usage</h1>
      </div>

      <div class="nav-container">
        <a href="/" class="nav-btn">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
          Back to Queue
        </a>
      </div>

      <div class="content">
        <div class="search-container">
          <div class="search-box">
            <input
              type="text"
              id="search-input"
              class="search-input"
              placeholder="Search users by name or email..."
            />
            <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <path d="m21 21-4.35-4.35"></path>
            </svg>
          </div>
        </div>

        <div id="loading" class="loading">Loading users...</div>
        <div id="error" class="error" style="display: none;"></div>

        <!-- Desktop Table -->
        <div id="users-table-container" class="users-table-container" style="display: none;">
          <table class="users-table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Discord</th>
                <th>Usage</th>
                <th>Jobs</th>
              </tr>
            </thead>
            <tbody id="users-table-body"></tbody>
          </table>
        </div>

        <div id="users-card-list" class="users-card-list" style="display: none;"></div>

        <div id="empty-state" class="empty-state" style="display: none;">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
          </svg>
          <h2>No Users Found</h2>
          <p>No users match your search criteria.</p>
        </div>
      </div>
    </div>

    <div id="user-modal" class="modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" id="modal-user-name">User Details</h2>
          <button class="close-btn" id="close-modal">×</button>
        </div>
        <div class="modal-body">
          <div class="detail-section">
            <h3>User Information</h3>
            <div class="detail-grid">
              <div class="detail-item">
                <div class="detail-label">Name</div>
                <div class="detail-value" id="modal-name">-</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Email</div>
                <div class="detail-value" id="modal-email">-</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Discord</div>
                <div class="detail-value" id="modal-discord">-</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">User ID</div>
                <div class="detail-value" id="modal-user-id">-</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Filament Usage</div>
                <div class="detail-value" id="modal-usage">-</div>
              </div>
              <div class="detail-item">
                <div class="detail-label">Total Jobs</div>
                <div class="detail-value" id="modal-job-count">-</div>
              </div>
            </div>
          </div>

          <div class="detail-section">
            <h3>Recent Jobs</h3>
            <div id="modal-jobs-list" class="jobs-list"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const tableBody = document.getElementById('users-table-body');
      const cardList  = document.getElementById('users-card-list');
      const tableContainer = document.getElementById('users-table-container');

      function isMobile() {
        return window.innerWidth <= 700;
      }

      function syncVisibility() {
        const hasRows = tableBody && tableBody.children.length > 0;
        if (hasRows) {
          if (tableContainer) tableContainer.style.display = isMobile() ? 'none' : 'block';
          if (cardList) cardList.style.display = isMobile() ? 'flex' : 'none';
        }
      }

      function buildCards() {
        if (!cardList || !tableBody) return;
        cardList.innerHTML = '';

        Array.from(tableBody.querySelectorAll('tr')).forEach(row => {
          const cells = row.querySelectorAll('td');
          if (!cells.length) return;

          const card = document.createElement('div');
          card.className = 'user-card';

          card.addEventListener('click', () => row.click());

          // Name
          const name = document.createElement('div');
          name.className = 'user-card-name';
          name.textContent = cells[0]?.textContent?.trim() || '-';
          card.appendChild(name);

          // Email
          const email = document.createElement('div');
          email.className = 'user-card-email';
          email.textContent = cells[1]?.textContent?.trim() || '-';
          card.appendChild(email);

          // Row: Discord + Jobs
          const row1 = document.createElement('div');
          row1.className = 'user-card-row';

          const discordWrap = document.createElement('div');
          discordWrap.innerHTML = `<div class="user-card-label">Discord</div><div class="user-card-value">${cells[2]?.textContent?.trim() || '-'}</div>`;
          row1.appendChild(discordWrap);

          const jobsWrap = document.createElement('div');
          jobsWrap.innerHTML = `<div class="user-card-label">Jobs</div><div class="user-card-value">${cells[4]?.innerHTML?.trim() || '-'}</div>`;
          row1.appendChild(jobsWrap);
          card.appendChild(row1);

          // Usage bar (clone inner HTML from table cell)
          const usageWrap = document.createElement('div');
          usageWrap.style.marginTop = '10px';
          usageWrap.innerHTML = `<div class="user-card-label" style="margin-bottom:6px;">Filament Usage</div>${cells[3]?.innerHTML?.trim() || '-'}`;
          card.appendChild(usageWrap);

          cardList.appendChild(card);
        });

        syncVisibility();
      }

      if (tableBody) {
        const observer = new MutationObserver(buildCards);
        observer.observe(tableBody, { childList: true, subtree: true });
      }

      window.addEventListener('resize', syncVisibility);
    </script>

    <script type="module" src="/src/users.ts"></script>
  </body>
</html>
